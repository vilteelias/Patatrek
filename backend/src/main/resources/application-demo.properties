# Perfil "demo": levanta el backend con una base en memoria (H2),
# sin necesidad de SQL Server. Los datos se pierden al cerrar.
# Uso:  mvnw spring-boot:run -Dspring-boot.run.profiles=demo
spring.datasource.url=jdbc:h2:mem:patatrek;MODE=MSSQLServer;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.use_nationalized_character_data=false
