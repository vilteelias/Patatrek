spring.application.name=patatrek

# Base de datos
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=patatrek;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:patatrek_user}
spring.datasource.password=${DB_PASSWORD:desarrollo2026}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Subida de certificados médicos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

patatrek.archivos.directorio=uploads

server.error.include-message=always
server.error.include-stacktrace=never