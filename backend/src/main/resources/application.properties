spring.application.name=patatrek

# Puerto del servidor backend
server.port=8080

# Conexión a la Base de Datos SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=patatrek;encrypt=true;trustServerCertificate=true
spring.datasource.username=patatrek_user
spring.datasource.password=desarrollo2026


# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Subida de certificados médicos (Configuración que trajo v0)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

server.error.include-message=always
server.error.include-stacktrace=never