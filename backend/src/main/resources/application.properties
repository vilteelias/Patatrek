spring.application.name=backend

# ============================================================
#  Conexión a SQL Server
# ============================================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=PataTrek;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:patatrek_user}
spring.datasource.password=${DB_PASSWORD:desarrollo2026}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ============================================================
#  Configuración JPA / Hibernate
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ============================================================
#  Imágenes promocionales (RNF-05: hasta 5 MB por archivo)
# ============================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
patatrek.carpeta-uploads=uploads

# Origen del frontend (Vite) permitido por CORS
patatrek.frontend-url=http://localhost:5173

# Carga el catálogo de equipamiento y excursiones de ejemplo si las tablas están vacías
patatrek.cargar-datos-demo=true